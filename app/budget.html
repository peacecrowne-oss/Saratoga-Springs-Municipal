<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget Tracking</title>
  <style>
    :root {
      --brand: #2f5d8a; --brand-ink: #fff;
      --bg: #f6f7f9; --surface: #fff; --surface-2: #eef0f3; --border: #d9dde3;
      --text: #1c2430; --text-muted: #5b6573;
      --ok: #2e7d4f; --bad: #b3261e; --bad-bg: #fdecea; --unknown: #8a929c;
      --sim: #7a3fa0; --sim-bg: #f4ebfa;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --brand: #7fb0e0; --brand-ink: #0d1520;
        --bg: #12161c; --surface: #1a2029; --surface-2: #232a35; --border: #333c49;
        --text: #e6e9ee; --text-muted: #9aa4b2;
        --ok: #6cc28f; --bad: #f08a83; --bad-bg: #3a1c1a; --unknown: #7d8693;
        --sim: #c89be6; --sim-bg: #2c2036;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    /* A calm page background: a soft blue-to-sage wash behind the white panels. */
    :root { --page: linear-gradient(180deg, #e4edf5 0%, #eaf2ef 55%, #f2f5ee 100%); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: linear-gradient(180deg, #0f1822 0%, #111c1c 100%); } }
    html { min-height: 100%; background: var(--bg); }
    body { min-height: 100vh; background: var(--page); background-attachment: fixed; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 48px; }
    header { background: var(--brand); color: var(--brand-ink); border-bottom: 1px solid var(--border); }
    header .muted { color: var(--brand-ink); opacity: .9; }
    header button { background: transparent; color: var(--brand-ink); border: 1px solid currentColor; border-radius: 6px; padding: 3px 10px; cursor: pointer; font: inherit; font-size: 13px; }
    header button:hover { background: color-mix(in srgb, var(--brand-ink) 15%, transparent); }
    header .title { display: flex; align-items: center; gap: 12px; }
    .back-to-list { margin: 0 0 10px; }
    header .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 16px; margin: 28px 0 8px; }
    .signin { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--text-muted); }
    .signin input, .signin select, button { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    button { background: var(--brand); color: var(--brand-ink); border: 0; cursor: pointer; }
    .banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; font-size: 14px; }
    .banner.sim { background: var(--sim-bg); color: var(--sim); border: 2px dashed var(--sim); font-weight: 600; }
    .banner.dev { background: var(--surface-2); }
    .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 16px 0 8px; font-size: 14px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--unknown); margin-right: 6px; vertical-align: -1px; }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    .muted { color: var(--text-muted); }
    .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 12px 14px; }
    .error strong { display: block; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; }
    th { background: var(--surface-2); font-size: 13px; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tfoot td { font-weight: 600; }
  </style>
  <link rel="stylesheet" href="/shell.css">
</head>
<body class="shell">
  <aside class="sidebar">
      <a class="brand" href="/system">Saratoga Springs</a>
      <span class="brand-sub">City staff</span>
      <nav aria-label="Main">
        <a href="/system">Dashboard</a>
        <a href="/assets">Assets</a>
        <a href="/permits">Permitting</a>
        <a href="/history">Cityworks history</a>
        <a href="/budget" aria-current="page">Budget</a>
        <a href="/testing">Testing</a>
        <span class="group">Public</span>
        <a href="/portal">Permit portal</a>
      </nav>
    </aside>
  <div class="frame">
    <header class="topbar">
        <span class="sysname">Municipal Asset Management &amp; Permitting</span>
        <div id="session"></div>
    </header>
    <main class="wrap">
      <h1 class="page-title">Budget tracking</h1>
      <div id="sim"></div>
      <div class="status" id="status"><span><span class="dot"></span>Not checked yet</span></div>
      <div id="budget"></div>

      <section class="card">
        <h2>Recent budget activity (audit trail)</h2>
        <div id="audit" class="muted">Loading…</div>
      </section>
    </main>
  </div>
  <script type="module" src="/budget.js"></script>
</body>
</html>
