<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In</title>
  <style>
    :root {
      --brand: #2f5d8a; --brand-ink: #fff;
      --bg: #f6f7f9; --surface: #fff; --border: #d9dde3;
      --text: #1c2430; --text-muted: #5b6573; --bad: #b3261e; --bad-bg: #fdecea;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --brand: #7fb0e0; --brand-ink: #0d1520;
        --bg: #12161c; --surface: #1a2029; --border: #333c49;
        --text: #e6e9ee; --text-muted: #9aa4b2; --bad: #f08a83; --bad-bg: #3a1c1a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
    p { margin: 0 0 16px; color: var(--text-muted); font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
    input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    .login-card button { width: 100%; margin-top: 16px; font: inherit; font-weight: 600; padding: 9px; border: 0; border-radius: 6px; background: var(--brand); color: var(--brand-ink); cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .error { background: var(--bad-bg); color: var(--bad); border-radius: 6px; padding: 8px 12px; margin: 12px 0 0; font-size: 14px; }
    [hidden] { display: none; }
  </style>
  <link rel="stylesheet" href="/shell.css">
</head>
<body class="shell">
  <aside class="sidebar">
    <a class="brand" href="/login">Saratoga Springs</a>
    <span class="brand-sub">Asset management &amp; permitting</span>
    <nav aria-label="Main">
      <a href="/login" aria-current="page">Staff sign in</a>
      <span class="group">Public</span>
      <a href="/portal">Permit portal</a>
    </nav>
  </aside>
  <div class="frame">
    <header class="topbar">
      <span class="sysname">Municipal Asset Management &amp; Permitting</span>
    </header>
    <main class="wrap">
      <h1 class="page-title">Sign in</h1>
      <div class="card login-card">
        <form id="password-step" autocomplete="on">
          <p>Saratoga Springs asset management and permitting.</p>
          <label for="username">Username</label>
          <input id="username" name="username" autocomplete="username" required autofocus>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Continue</button>
        </form>
        <form id="code-step" hidden>
          <p>Enter the 6-digit code from your authenticator app.</p>
          <label for="code">Code</label>
          <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
          <button type="submit">Sign in</button>
        </form>
        <div id="message" class="error" role="alert" hidden></div>
      </div>
    </main>
  </div>
  <script type="module" src="/login.js"></script>
</body>
</html>
