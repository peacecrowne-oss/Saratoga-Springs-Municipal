<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Dashboard</title>
  <style>
    :root {
      --brand: #2f5d8a; --brand-ink: #fff;
      --bg: #f6f7f9; --surface: #fff; --surface-2: #eef0f3; --border: #d9dde3;
      --text: #1c2430; --text-muted: #5b6573;
      --ok: #2e7d4f; --bad: #b3261e; --bad-bg: #fdecea; --unknown: #8a929c;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --brand: #7fb0e0; --brand-ink: #0d1520;
        --bg: #12161c; --surface: #1a2029; --surface-2: #232a35; --border: #333c49;
        --text: #e6e9ee; --text-muted: #9aa4b2;
        --ok: #6cc28f; --bad: #f08a83; --bad-bg: #3a1c1a; --unknown: #7d8693;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px 48px; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); }
    header .wrap { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 12px 16px; }
    h1 { font-size: 18px; margin: 0; }
    h2 { font-size: 16px; margin: 28px 0 8px; }
    a { color: var(--brand); }
    .signin, form.asset { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--text-muted); }
    input, select, button { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
    button { background: var(--brand); color: var(--brand-ink); border: 0; cursor: pointer; }
    .banner { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; font-size: 14px; background: var(--surface-2); }
    .status { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 16px 0 8px; font-size: 14px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--unknown); margin-right: 6px; vertical-align: -1px; }
    .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); }
    .muted { color: var(--text-muted); }
    .error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 12px 14px; margin: 8px 0; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: top; }
    th { background: var(--surface-2); font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>System dashboard</h1>
      <div id="session" class="signin"></div>
    </div>
  </header>
  <main class="wrap">
    <div class="banner"><a href="/assets">Asset management</a> · <a href="/permits">Permitting</a> · <a href="/history">Cityworks history</a> · <a href="/testing">Testing</a> · <a href="/budget">Budget tracking</a></div>

    <div class="status" id="health"><span><span class="dot"></span>Not checked yet</span></div>

    <h2>Deployments</h2>
    <div id="deployments" class="muted">Loading…</div>

    <h2>Assets</h2>
    <form class="asset" id="asset-form">
      <input id="asset_tag" aria-label="Asset tag" placeholder="asset tag, e.g. HYD-0001" required>
      <input id="name" aria-label="Name" placeholder="name" required>
      <input id="asset_type" aria-label="Type" placeholder="type, e.g. hydrant" required>
      <input id="location" aria-label="Location" placeholder="location (optional)">
      <select id="status" aria-label="Status">
        <option>active</option><option>planned</option><option>maintenance</option><option>retired</option>
      </select>
      <button type="submit">Add asset</button>
    </form>
    <div id="asset-result"></div>
    <div id="assets" class="muted">Loading…</div>
  </main>
  <script type="module" src="/system.js"></script>
</body>
</html>
